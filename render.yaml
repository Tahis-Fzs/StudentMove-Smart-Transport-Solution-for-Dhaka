services:
  - type: web
    name: studentmove-app-d866
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health.html
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://studentmove-app-d866.onrender.com
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: MAIL_MAILER
        value: log
      - key: CACHE_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      # Render generates on first Blueprint create; copy from Dashboard → Environment afterward.
      - key: ADMIN_PASSWORD
        generateValue: true
      # Public SSLCommerz sandbox credentials (official docs) — safe defaults for Render demo checkout.
      - key: SSLCOMMERZ_STORE_ID
        value: testbox
      - key: SSLCOMMERZ_STORE_PASSWORD
        value: qwerty
      # Demo hosted on Render uses sandbox; set false + live store creds for real payments.
      - key: SSLCOMMERZ_SANDBOX
        value: "true"
      - key: SSLCOMMERZ_CURRENCY
        value: BDT
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_PROVIDERS
        value: google,facebook,github
