services:
  - type: web
    name: studentmove-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: studentmove-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: studentmove-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: studentmove-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: studentmove-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: studentmove-db
          property: password
      - key: MAIL_MAILER
        value: log
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_PROVIDERS
        value: google,facebook,github

databases:
  - name: studentmove-db
    plan: free
    databaseName: studentmove_db
    user: studentmove_user
